<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Taste compounds in both directions</title><desc id="desc">A clean system compounds clarity into better agent output, while ambiguity compounds into more ambiguity.</desc>
<defs><linearGradient id="good" x1="0" x2="1"><stop stop-color="#9be15d"/><stop offset="1" stop-color="#00c9a7"/></linearGradient><linearGradient id="bad" x1="0" x2="1"><stop stop-color="#ffb86b"/><stop offset="1" stop-color="#ff6b6b"/></linearGradient><marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#75d6b0"/></marker><marker id="arrowb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6Z" fill="#ff9d7d"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#111827"/><text x="60" y="60" fill="#9ca3af" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3">THE DIRECTION OF COMPOUNDING</text>
<g font-family="Inter,Arial,sans-serif"><text x="60" y="125" fill="#f9fafb" font-size="34" font-weight="600">The agent amplifies the primitives it receives.</text><text x="60" y="165" fill="#9ca3af" font-size="20">Same tool. Different foundation. Different future.</text>
<g transform="translate(70 225)"><rect width="470" height="220" rx="18" fill="#17251f" stroke="#386b55"/><text x="28" y="42" fill="#9be15d" font-size="20" font-weight="600">GOOD PRIMITIVES</text><text x="28" y="82" fill="#f9fafb" font-size="25">clear intent</text><path d="M170 73h82" stroke="#75d6b0" stroke-width="3" marker-end="url(#arrowg)"/><text x="285" y="82" fill="#f9fafb" font-size="25">mechanical gates</text><path d="M118 120 170 120M248 120 300 120" stroke="#75d6b0" stroke-width="3" marker-end="url(#arrowg)"/><text x="28" y="160" fill="#d1fae5" font-size="28">better agent output</text><text x="28" y="193" fill="#75d6b0" font-size="18">clarity compounds →</text></g>
<g transform="translate(660 225)"><rect width="470" height="220" rx="18" fill="#2b211e" stroke="#75463e"/><text x="28" y="42" fill="#ffb86b" font-size="20" font-weight="600">BAD PRIMITIVES</text><text x="28" y="82" fill="#f9fafb" font-size="25">ambiguous intent</text><path d="M200 73h82" stroke="#ff9d7d" stroke-width="3" marker-end="url(#arrowb)"/><text x="300" y="82" fill="#f9fafb" font-size="25">plausible patches</text><path d="M130 120 180 120M260 120 310 120" stroke="#ff9d7d" stroke-width="3" marker-end="url(#arrowb)"/><text x="28" y="160" fill="#fee2e2" font-size="28">hidden complexity</text><text x="28" y="193" fill="#ff9d7d" font-size="18">ambiguity compounds →</text></g></g></svg>