<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Context debt multiplies token consumption</title><desc id="desc">Six unretired sessions consumed 654 million of 865 million input tokens.</desc>
<defs><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#ff7a7a"/><stop offset="1" stop-color="#ffb86b"/></linearGradient></defs><rect width="1200" height="520" rx="24" fill="#111827"/><g font-family="Inter,Arial,sans-serif"><text x="60" y="60" fill="#9ca3af" font-family="ui-monospace,monospace" font-size="18" letter-spacing="3">CONTEXT DEBT, VISUALISED</text><text x="60" y="125" fill="#f9fafb" font-size="34" font-weight="600">Six sessions carried 76% of the load.</text><text x="60" y="165" fill="#9ca3af" font-size="20">The system was green. The context was not.</text><g transform="translate(60 225)"><text x="0" y="0" fill="#f9fafb" font-size="21">865M total input tokens</text><rect x="0" y="28" width="1030" height="62" rx="12" fill="#263244"/><rect x="0" y="28" width="782" height="62" rx="12" fill="url(#bar)"/><text x="25" y="68" fill="#111827" font-size="23" font-weight="700">654M · six unretired sessions</text><text x="805" y="68" fill="#d1d5db" font-size="20">211M rest</text><text x="0" y="145" fill="#ffb86b" font-size="28" font-weight="600">76%</text><text x="110" y="145" fill="#d1d5db" font-size="22">of all input consumption</text><text x="0" y="202" fill="#9ca3af" font-size="20">Fresh session</text><rect x="180" y="180" width="105" height="30" rx="6" fill="#75d6b0"/><text x="310" y="204" fill="#9ca3af" font-size="18">~9.5K tokens / call</text><text x="0" y="258" fill="#9ca3af" font-size="20">Whale session</text><rect x="180" y="236" width="650" height="30" rx="6" fill="url(#bar)"/><text x="855" y="260" fill="#ffb86b" font-size="18">105K–211K / call</text></g><text x="60" y="470" fill="#6b7280" font-size="16">8,912 calls · 524 sessions · 21 days</text></g></svg>